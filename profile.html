<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — Todo List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="profile-page">
    <a class="back-link" href="index.html">← Назад к задачам</a>
    <section class="profile-card">
      <p class="eyebrow">ПРОФИЛЬ</p>
      <h1>Создайте свой профиль</h1>
      <p class="profile-text">Введите данные, чтобы начать пользоваться Todo List.</p>
      <form class="profile-form">
        <label>Ваше имя<input type="text" placeholder="Например, Алексей"></label>
        <label>Электронная почта<input type="email" placeholder="example@mail.com"></label>
        <label>Пароль<input type="password" placeholder="Введите пароль"></label>
        <button type="submit">Зарегистрироваться</button>
      </form>
      <p class="login-hint">Уже есть аккаунт? <a href="#">Войти</a></p>
    </section>
  </main>
</body>
</html>
