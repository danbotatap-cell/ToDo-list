<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <a class="logo" href="#">Todo List</a>

        <nav class="menu">
          <a class="menu-link active" href="#">All tasks</a>
          <a class="menu-link" href="today.html">Today</a>
          <a class="menu-link" href="completed.html">Completed</a>
        </nav>

    </aside>

      <main class="content">
        <header class="header">
          <div>
            <p class="eyebrow">MY PLAN</p>
          <h1>Todo List</h1>
            <p class="subtitle">
              Small steps lead to big results.
            </p>
          </div>
        </header>

        <section class="stats">
          <article class="stat-card tasks-stat">
            <div>
              <strong data-stat="active">0</strong>
              <p>Active tasks</p>
            </div>
          </article>
          <article class="stat-card done-stat">
            <div>
              <strong data-stat="completed">0</strong>
              <p>Completed tasks</p>
            </div>
          </article>
        </section>

        <section class="tasks-box">
          <div class="box-heading">
            <div>
              <h2>Task list</h2>
              <p>Your tasks will appear here</p>
            </div>
            <span class="counter" data-counter>0 tasks</span>
          </div>

          <form class="task-form" data-task-form>
            <input type="text" name="task" placeholder="Add a new task" autocomplete="off" required />
            <button type="submit">Add task</button>
          </form>
          <div class="task-actions">
            <button class="text-button" type="button" data-clear="all">Clear all</button>
          </div>
          <div class="task-list" data-task-list></div>
        </section>
      </main>
    </div>
  </body>
</html>
