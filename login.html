<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Todo List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="profile-page">
    <a class="back-link" href="index.html">← Назад к задачам</a>
    <section class="profile-card" data-login-page>
      <p class="eyebrow">АККАУНТ</p>
      <h1>Войти в Todo List</h1>
      <p class="profile-text">Введите email и пароль, указанные при регистрации.</p>
      <form class="profile-form" data-login-form>
        <label>Электронная почта<input name="email" type="email" placeholder="example@mail.com" required></label>
        <label>Пароль<input name="password" type="password" placeholder="Введите пароль" required></label>
        <button type="submit">Войти</button>
      </form>
      <p class="form-message" data-form-message></p>
      <p class="login-hint">Нет аккаунта? <a href="profile.html">Зарегистрироваться</a></p>
    </section>
  </main>
</body>
</html>
